<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Alunos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastrar Novo Aluno (POST)</h2>
    
    <!-- O formulário envia os dados para a mesma URL atual usando POST -->
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="ra">ra do Aluno:</label>
            <input type="text" id="ra" name="ra" required>
        </div>
        <div class="form-group">
            <label for="nome">Nome do Aluno:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        
        <div class="form-group">
            <label for="nascimento">Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </div>
        
        <button type="submit">Salvar Aluno</button>
    </form>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

    <h2>Alunos Cadastrados (GET)</h2>
    <table>
        <thead>
            <tr>
                <!-- <th>ID</th> -->
                <th>RA</th>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop do Django para listar os alunos enviados pela View -->
            {% for alunos in aluno %}
            <tr>
                <td>{{ alunos.RA }}</td>
                <td>{{ alunos.nome }}</td>
                <td>{{ alunos.nascimento }} anos</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" style="text-align: center; color: #777;">Nenhum aluno cadastrado ainda.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
